[tool.black]
line-length = 200
target-version = ["py311"]

[tool.ruff]
line-length = 200
lint.select = ["E", "F", "I", "N", "W", "UP"]

[tool.isort]
profile = "black"
line_length = 200

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = ["integration: marks tests as end-to-end integration tests requiring OPENAI_API_KEY"]
